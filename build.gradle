/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    // BIOBUZZ: the ftc-sim simulator plugin is only put on the classpath when you ask for it with
    // -PftcSim (e.g. ./gradlew -PftcSim :TeamCode:dashboard). A normal robot build never sees it.
    // See TeamCode/README-AUTO.md.
    if (project.hasProperty('ftcSim')) {
        dependencies {
            classpath 'org.ngi-collective.ftc-sim:gradle-plugin:12.0.4'
        }
    }
}

plugins {
    // Note for FTC Teams: Do not modify this yourself.
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

repositories {
    mavenCentral()
}
